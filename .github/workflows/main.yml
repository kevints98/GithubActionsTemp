
name: Build and deploy orchestrator

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: orchestrator-production
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
  IMAGE_NAME: orchestrator
  DOTNET_VERSION: '10.0'

jobs:
  build-and-deploy:
    name: Test, build and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ./solutionName.sln

      - name: Build
        run: dotnet build ./solutionName.sln \
          --configuration Release --no-restore

      - name: Test
        run: dotnet test ./solutionName.test.sln \
          --configuration Release --no-build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/orchestrator:${IMAGE_TAG}"

          docker build \
            --pull \
            --file ./Dockerfile \
            --tag "$IMAGE" \
            .

          docker push "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE"

      - name: Show deployed revision
        run: |
          az containerapp show \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.latestRevisionName" \
            --output tsv
